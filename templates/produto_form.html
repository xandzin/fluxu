{% extends "base.html" %}
{% block titulo %}{{ "Novo produto" if modo == "novo" else "Editar produto" }}{% endblock %}
{% block conteudo %}
<h1>{{ "Cadastrar produto" if modo == "novo" else "Editar produto" }}</h1>

{% if erro %}
<p class="aviso erro">{{ erro }}</p>
{% endif %}

<form class="card" method="post">
    <div class="campo">
        <label for="sku_ean">SKU/EAN</label>
        <input id="sku_ean" name="sku_ean" type="text" value="{{ valores.sku_ean }}" class="mono"
               {% if modo == "editar" %}readonly{% else %}placeholder="Código de barras, ou um código interno se o produto não tiver um"{% endif %}>
    </div>

    <div class="campo">
        <label for="descricao">Descrição</label>
        <input id="descricao" name="descricao" type="text" value="{{ valores.descricao }}" required>
    </div>

    <div class="grade-2">
        <div class="campo">
            <label for="categoria">Categoria</label>
            <input id="categoria" name="categoria" type="text" list="categorias-lista" value="{{ valores.categoria }}">
            <datalist id="categorias-lista">
                {% for c in categorias %}<option value="{{ c }}">{% endfor %}
            </datalist>
        </div>
        <div class="campo">
            <label for="unidade">Unidade</label>
            <input id="unidade" name="unidade" type="text" value="{{ valores.unidade }}">
        </div>
    </div>

    <div class="grade-2">
        <div class="campo">
            <label for="custo_unitario">Custo unitário (R$)</label>
            <input id="custo_unitario" name="custo_unitario" type="number" step="0.01" min="0" value="{{ valores.custo_unitario }}" class="mono">
        </div>
        <div class="campo">
            <label for="preco_venda">Preço de venda (R$)</label>
            <input id="preco_venda" name="preco_venda" type="number" step="0.01" min="0" value="{{ valores.preco_venda }}" class="mono">
        </div>
    </div>

    <div class="grade-2">
        <div class="campo">
            <label for="saldo_atual">Saldo em estoque</label>
            <input id="saldo_atual" name="saldo_atual" type="number" step="any" value="{{ valores.saldo_atual }}"
                   placeholder="Deixe em branco se ainda não contou" class="mono">
        </div>
        <div class="campo">
            <label for="validade">Validade</label>
            <input id="validade" name="validade" type="date" value="{{ valores.validade }}">
        </div>
    </div>

    <div class="campo">
        <label for="estoque_minimo">Estoque mínimo (alerta no Dashboard quando o saldo cair até aqui)</label>
        <input id="estoque_minimo" name="estoque_minimo" type="number" step="any" min="0" value="{{ valores.estoque_minimo }}"
               placeholder="Deixe em branco pra só alertar quando zerar" class="mono">
    </div>

    <div class="campo checkbox-linha">
        <label for="favorito">
            <input id="favorito" name="favorito" type="checkbox" value="1" {% if valores.favorito == "1" %}checked{% endif %}>
            Produto favorito (aparece como atalho de acesso rápido na tela de Venda)
        </label>
    </div>

    <div class="botoes">
        <button type="submit" class="primario">{{ "Cadastrar" if modo == "novo" else "Salvar alterações" }}</button>
        <a href="{{ url_for('estoque') }}" class="secundario botao-link">Cancelar</a>
    </div>
</form>
{% endblock %}
